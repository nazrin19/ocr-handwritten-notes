spring.application.name=notex

gemini.api.key=${GEMINI_API_KEY}

gemini.model=gemini-3.7-flash
gemini.fallback-model=gemini-3.5-flash-lite

gemini.embedding-model=gemini-embedding-001
gemini.embedding-dimensions=768

spring.datasource.url=jdbc:postgresql://localhost:5432/notex
spring.datasource.username=notex
spring.datasource.password=${DB_PASSWORD:notex_dev_pw}
spring.sql.init.mode=always

rag.top-k=4